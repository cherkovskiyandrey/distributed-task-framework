buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        classpath libs.spring.configuration.property.documenter.gradle.plugin
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

apply plugin: libs.plugins.property.documenter.get().pluginId

dependencies {
    api project(':distributed-task-base-saga-library')
    api project(':distributed-task-spring-boot-starter')

    api libs.spring.boot
    api libs.spring.boot.autoconfigure
    api libs.spring.data.jdbc
    api libs.spring.boot.starter.validation
    api libs.spring.boot.starter.actuator

    implementation project(':common-spring-utils')
    implementation libs.caffeine
    implementation libs.liquibase

    annotationProcessor libs.spring.boot.configuration.processor

    // For integration tests
    testImplementation testFixtures(project(':common-spring-utils'))
    testImplementation project(':distributed-task-test-spring-boot-starter')

    testImplementation(libs.spring.boot.starter.test) {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
}

tasks.register('generateAdoc') {
    dependsOn generatePropertyDocument {
        documentName = "DSF Spring configuration properties"
        documentDescription = "This is a document about the configuration properties in DSF (saga) autoconfiguration module"
        type = "MARKDOWN"
        metadataInput = file("build/classes/java/main/META-INF/spring-configuration-metadata.json")
        outputFile = file("config-prop.md")
        markdownCustomization {
            unknownGroupLocalization = "distributed-task.saga"
        }
    }
}

compileJava.inputs.files(processResources)

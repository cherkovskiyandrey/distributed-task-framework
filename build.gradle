plugins {
    alias(libs.plugins.spring.boot) apply(false)
    alias(libs.plugins.org.ajoberstar.grgit) apply(false)
    alias(libs.plugins.org.jreleaser) apply(false)
    id "base"
}

var grgitPluginId = libs.plugins.org.ajoberstar.grgit.get().pluginId
var jreleaserPluginId = libs.plugins.org.jreleaser.get().pluginId

description = "The task processing framework with saga supporting"

var libraries = subprojects.findAll { !it.name.contains('application') }
var apps = subprojects.findAll { it.name.contains('application') }

// Opt-in delombok mode, see the block in allprojects below and .github/workflows.
var delombokEnabled = Boolean.parseBoolean((project.findProperty('delombok') ?: 'false') as String)

allprojects {
    group = 'io.github.cherkovskiyandrey'
    version = project.properties['version']
    version = version == 'unspecified' ? '2.0.0' : version

    apply plugin: libs.plugins.spring.boot.get().pluginId
    apply plugin: 'maven-publish'
    apply plugin: 'java-library'
    apply plugin: 'base'

    repositories {
        mavenCentral()
        mavenLocal()
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        //dependency management
        implementation platform(libs.spring.boot.bom)

        //Lombok
        compileOnly libs.org.projectlombok.lombok
        annotationProcessor libs.org.projectlombok.lombok
        testCompileOnly libs.org.projectlombok.lombok
        testAnnotationProcessor libs.org.projectlombok.lombok

        //Mapstruct
        implementation libs.org.mapstruct
        annotationProcessor libs.org.mapstruct.processor
        annotationProcessor libs.org.lombok.mapstruct.binding

        //Common tools
        implementation libs.jackson.databind
        implementation libs.guava
        implementation libs.commons.lang3
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Delombok, opt-in via -Pdelombok=true (see issue #16). When enabled, compileJava and
    // sourcesJar consume the very same delombok output, so the LineNumberTable of the published
    // bytecode matches the published sources and debugging through attached sources works.
    // Running delombok only for the sources jar would not help: the two would still diverge.
    if (delombokEnabled && libraries.contains(project)) {
        configurations {
            lombokTool {
                canBeConsumed = false
                canBeResolved = true
            }
        }

        dependencies {
            lombokTool libs.org.projectlombok.lombok
        }

        var delombokDir = layout.buildDirectory.dir('delombok/main')
        var mainJava = sourceSets.main.java
        var compileClasspath = configurations.named('compileClasspath')

        var delombokTask = tasks.register('delombok', JavaExec) {
            group = 'build'
            description = 'Applies delombok to the main sources'

            inputs.files(mainJava.sourceDirectories.asFileTree.matching { include '**/*.java' })
                    .withPropertyName('mainJava')
                    .withPathSensitivity(PathSensitivity.RELATIVE)
                    .skipWhenEmpty()
                    .ignoreEmptyDirectories()
            inputs.files(compileClasspath)
                    .withPropertyName('compileClasspath')
                    .withNormalizer(ClasspathNormalizer)
            outputs.dir(delombokDir).withPropertyName('delomboked')
            outputs.cacheIf { true }

            classpath = files(configurations.named('lombokTool'))
            mainClass = 'lombok.launch.Main'

            argumentProviders.add({ ->
                var arguments = [
                        'delombok',
                        '--encoding=UTF-8',
                        // Only java files, resources are taken from the source set directly.
                        '--nocopy',
                        // The default header carries a timestamp, which would rewrite every file on
                        // every run and defeat incremental compilation.
                        '--format=generateDelombokComment:skip',
                        '--format=javaLangAsFQN:skip',
                        '--format=suppressWarnings:skip',
                        '--format=danceAroundIdeChecks:skip',
                        // Lombok does not add @ConstructorProperties at compile time either, and it
                        // would silently change how Jackson picks a creator.
                        '--format=constructorProperties:skip',
                        '--format=indent:4',
                        '--target=' + delombokDir.get().asFile.absolutePath,
                ]
                var compileClasspathPath = compileClasspath.get().asPath
                if (compileClasspathPath) {
                    arguments << '--classpath=' + compileClasspathPath
                }
                arguments + mainJava.srcDirs.findAll { it.directory }*.absolutePath
            } as CommandLineArgumentProvider)

            // Delombok overwrites files, but never drops the ones whose source is gone.
            doFirst {
                delombokDir.get().asFile.deleteDir()
            }
        }

        // Only compileJava: compileTestJava keeps reading the original test sources.
        // src/main/java stays the source root of the source set, so the IDEA import is unaffected.
        tasks.named('compileJava', JavaCompile) {
            dependsOn delombokTask
            source = fileTree(delombokDir) { include '**/*.java' }
        }

        // Registered before withSourcesJar(): Gradle reuses an already existing sourcesJar task
        // instead of registering its own, and still wires it into the sourcesElements variant.
        tasks.register('sourcesJar', Jar) {
            group = 'build'
            description = 'Assembles a jar archive containing the delomboked main sources'
            archiveClassifier = 'sources'
            from delombokTask
            from sourceSets.main.resources
        }
        tasks.named('assemble') { dependsOn 'sourcesJar' }
    }

    java {
//        withJavadocJar()
        withSourcesJar()
    }

    jar {
        enabled = false
    }

    bootJar {
        enabled = false
    }

    test {
        useJUnitPlatform()
        testLogging {
            exceptionFormat = 'full'
        }
    }
}

configure(libraries) { project_ ->

    apply plugin: grgitPluginId
    apply plugin: jreleaserPluginId

    bootJar {
        enabled = false
    }

    jar {
        enabled = true
    }

    test {
        maxHeapSize = "2048m"
        testLogging {
            exceptionFormat = 'full'
        }
    }

    publishing {
        repositories {
            maven {
                setUrl(layout.buildDirectory.dir("staging-deploy"))
            }
            mavenLocal()
        }
        publications {
            maven(MavenPublication) {
                from components.java

                var currentTag = grgit.tag.list().find {
                    it.commit.id == grgit.head().getId()
                }
                if (currentTag != null) {
                    var ver = currentTag.name
                    if (ver.startsWith("v")) {
                        ver = ver.substring(1)
                    }
                    version = ver
                } else {
                    version = System.getProperty("CI_COMMIT_BRANCH", grgit.getBranch().current().getName()).replaceAll("\\W", "_") +
                            "-" +
                            new Date().format('yyyyMMdd_HHmmss') +
                            "-" +
                            grgit.head().getId().substring(0, 8)
                }

                groupId = "io.github.cherkovskiyandrey"

                pom {
                    name = "Distributed Task Framework"
                    description = "The task processing framework"
                    inceptionYear = '2022'
                    url = "https://github.com/cherkovskiyandrey/distributed-task-framework"
                    issueManagement {
                        url = "https://github.com/cherkovskiyandrey/distributed-task-framework/issues"
                    }

                    scm {
                        url = "https://github.com/cherkovskiyandrey/distributed-task-framework"
                        connection = "scm:git://github.com/cherkovskiyandrey/distributed-task-framework.git"
                        developerConnection = "scm:git://github.com/cherkovskiyandrey/distributed-task-framework.git"
                    }

                    licenses {
                        license {
                            name = "The Apache Software License, Version 2.0"
                            url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                            distribution = "repo"
                        }
                    }

                    developers {
                        developer {
                            id = "cherkovskiyandrey"
                            name = "Andrey Cherkovskiy"
                            email = "andreycherkovskiy@gmail.com"
                            url = "https://github.com/cherkovskiyandrey"
                        }
                    }
                }
            }
        }
    }

    // JReleaser configuration only in root project
    jreleaser {
        dryrun = false
        project {
            authors = ['Andrey Cherkovskiy']
            license = 'Apache-2.0'
            links {
                homepage = 'https://github.com/cherkovskiyandrey/distributed-task-framework'
            }
            inceptionYear = '2022'
        }
        release {
            github {
                skipRelease = true
                skipTag = true
                sign = true
                branch = "main"
                branchPush = "main"
                overwrite = true
            }
        }
        signing {
            active = 'ALWAYS'
            armored = true
        }
        deploy {
            maven {
                mavenCentral {
                    sonatype {
                        active = 'ALWAYS'
                        url = "https://central.sonatype.com/api/v1/publisher"
                        stagingRepository(layout.buildDirectory.dir("staging-deploy").get().toString())
                        setAuthorization("Basic")
                        retryDelay = 60
                    }
                }
            }
        }
    }
}

configure(apps) { project ->
    bootJar {
        enabled = true
    }

    jar {
        enabled = true
    }
}

publish {
    dependsOn libraries.publish
}

build {
    dependsOn subprojects.build
}

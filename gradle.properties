org.gradle.jvmargs=--add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
--add-opens=java.base/java.lang=ALL-UNNAMED \
--add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
--add-opens=java.base/java.io=ALL-UNNAMED \
--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED

version=1.0.0
group=io.github.cherkovskiyandrey

# Set to true (or pass -Pdelombok=true) to compile published modules from delomboked
# sources and ship the very same sources in the -sources.jar, see issue #16.
# Kept off by default: it disables incremental compilation and makes javac report
# errors against build/delombok/main instead of src/main/java.
delombok=false
